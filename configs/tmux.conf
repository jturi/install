set-environment -g TERM_PROGRAM ghostty
set-environment -g TERM_PROGRAM_BACKGROUND dark
set-environment -g COLORFGBG "15;0"
set -g allow-passthrough on

# =============================================================================
# TMUX CONFIGURATION
# =============================================================================
# Prefix Key: Ctrl+a  (instead of default Ctrl+b)
#   Press Ctrl+a, RELEASE, then press the command key.
#   To send a literal Ctrl+a to the terminal (e.g. bash "go to line start"),
#   press Ctrl+a twice.
#
# =============================================================================
# QUICK REFERENCE
# =============================================================================
#
# --- SESSIONS ----------------------------------------------------------------
#   tmux new -s <name>     Start a new named session
#   Prefix D               Detach from session (keeps running in background)
#   Prefix s               Pick a session to switch to (interactive list)
#   Prefix $               Rename current session
#   Prefix L               Toggle back to the last session
#   Prefix ( / )           Switch to previous / next session
#
# --- WINDOWS (like tabs) -----------------------------------------------------
#   Prefix c               Create a new window
#   Prefix ,               Rename current window (type name, press Enter)
#   Prefix n / p           Go to next / previous window
#   Prefix k               Toggle to the last-used window
#   Prefix w               Show interactive window list (pick with arrows + Enter)
#   Prefix f               Find window by name (type to search)
#   Prefix 0-9             Jump directly to window by number
#   Prefix X               Kill (close) current window -- no confirmation
#   Prefix < / >           Swap current window left / right (reorder)
#
# --- PANES (splits inside a window) ------------------------------------------
#   Prefix |               Split horizontally (pane opens on the right)
#   Prefix -               Split vertically   (pane opens below)
#   Prefix h / i / u       Navigate panes: Left / Right / Up
#   Prefix o               Cycle through panes in order
#   Prefix { / }           Swap current pane backward / forward
#   Prefix !               Break current pane out into its own window
#   Prefix z               Toggle zoom (fullscreen) on current pane
#   Prefix d               Kill (close) current pane
#   Prefix Space           Cycle through different pane layouts
#   Alt+H / J / K / L      Resize pane Left / Down / Up / Right (no prefix!)
#
# --- COPY MODE (scroll back & search) ----------------------------------------
#   Prefix [               Enter copy/scroll mode
#   PgUp / PgDn            Scroll page up / down
#   Arrow keys / h/j/k/l   Move cursor
#   v                      Start visual selection
#   V                      Toggle rectangle (block) selection
#   y / Enter              Copy selection to system clipboard
#   /                      Search forward  (n = next match, N = prev match)
#   ?                      Search backward
#   q / Esc                Exit copy mode
#   Prefix ]               Paste from tmux buffer
#
# --- MISC --------------------------------------------------------------------
#   Prefix r               Reload this config file
#   Prefix :               Open command prompt (type tmux commands)
#   Prefix ?               Show all key bindings
#   Prefix t               Show a big clock
#
# =============================================================================
# EXAMPLE WORKFLOW
# =============================================================================
# 1. START A SESSION:
#      $ tmux new -s myproject
#      You are now inside tmux. The green status bar shows the session name.
#
# 2. CREATE & RENAME WINDOWS:
#      Ctrl+a  c           Create a new window (like a browser tab)
#      Ctrl+a  ,           Rename it -- type "editor" and press Enter
#      Ctrl+a  c           Create another window
#      Ctrl+a  ,           Rename it -- type "server" and press Enter
#      Ctrl+a  n / p       Jump between windows
#
# 3. SPLIT PANES (within a window):
#      Ctrl+a  |           Split horizontally -- editor + side-by-side terminal
#      Ctrl+a  -           Split vertically   -- editor + terminal below
#      Ctrl+a  h / i / d / u   Move between panes
#      Alt+H / J / K / L   Resize panes (hold Alt + press H/J/K/L)
#
# 4. SCROLL BACK THROUGH HISTORY:
#      Ctrl+a  [           Enter copy mode
#      Use PgUp/PgDn or arrow keys to scroll
#      /                   Search for text (e.g. "error")
#      n / N               Jump to next / previous match
#      q                   Exit copy mode
#
# 5. MANAGE & CLOSE:
#      Ctrl+a  x           Kill the current pane
#      Ctrl+a  X           Kill the current window (and all its panes)
#      Ctrl+a  z           Fullscreen a pane (zoom); press again to unzoom
#      Ctrl+a  < / >       Move current window left / right
#
# 6. DETACH & REATTACH:
#      Ctrl+a  D           Detach (session keeps running in background)
#      $ tmux a            Reattach to your session later
#      $ tmux ls           List all sessions
#      $ tmux a -t <name>  Attach to a specific session by name
#
# 7. RELOAD CONFIG:
#      After editing this file, run:  Ctrl+a  r
# =============================================================================



# =============================================================================
# GENERAL SETTINGS
# =============================================================================

### REMAP Prefix from Ctrl+b to Ctrl+a (also M-a / Left Alt+a)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set-option -g prefix2 M-a
bind-key M-a send-prefix -2

# Unbind x so it does nothing
unbind x

# Fix slow escape-time for vim (reduces delay when leaving insert mode)
set -sg escape-time 100

# Increase scrollback buffer to 10,000 lines (use Prefix [ to browse)
set-option -g history-limit 20000

# Prevent tmux from automatically renaming windows (preserves custom names)
set-option -g allow-rename off

# Enable mouse support (click panes, drag resize, scroll copy mode)
set -g mouse on

# Preserve OSC 8 hyperlinks from terminal apps (such as OpenCode) for
# supporting clients, including Ghostty.
set -as terminal-features ',*:hyperlinks'

# Scroll 1 line per mouse wheel tick
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e; send-keys -X scroll-up -N 1"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -X scroll-down -N 1"

# Start numbering at 1 (instead of 0) for both windows and panes
set -g base-index 1
setw -g pane-base-index 1

# Auto-renumber windows when one is closed (no gaps in numbering)
set -g renumber-windows on

# ====
# KEY BINDINGS — PANE SPLITTING
# ====

# Split pane horizontally (|) — opens a pane to the right, keeping current path
bind | split-window -h -c "#{pane_current_path}"

# Split pane vertically (-) — opens a pane below, keeping current path
bind - split-window -v -c "#{pane_current_path}"

# ====
# KEY BINDINGS — PANE SPLITTING Custom Merge and Mark Bindings
# ====
# Unbind default mark bindings
unbind m
unbind M

# Prefix + m: Merge/Join window horizontally (prompts for window number)
bind m command-prompt -p "Join window (horizontal):" "join-pane -h -s '%%'"

# Prefix + M (Shift + m): Toggle Mark on the current pane
bind M select-pane -m

# ====
# KEY BINDINGS — PANE NAVIGATION
# ====

# Navigate to pane on the left (prefix + h)
bind h select-pane -L

# Navigate to pane on the right (prefix + i)
bind i select-pane -R



# Navigate to pane above (prefix + u)
bind u select-pane -U

# Cycle through panes in order (prefix + o)
bind o select-pane -t :.+

# Navigate to previous window (prefix + j)
bind j previous-window

# Navigate to next window (prefix + l)
bind l next-window

# ====
# KEY BINDINGS — PANE MANAGEMENT
# ====

# Swap current pane backward (prefix + {)
bind "{" swap-pane -D

# Swap current pane forward (prefix + })
bind "}" swap-pane -D

# Break current pane out into its own window (prefix + !)
bind ! break-pane

# ====
# KEY BINDINGS — PANE RESIZING (Alt + Vim keys, no prefix needed)
# ====

# Resize pane left by 2 cells
bind -n M-H resize-pane -L 2

# Resize pane down by 2 cells
bind -n M-J resize-pane -D 2

# Resize pane up by 2 cells
bind -n M-K resize-pane -U 2

# Resize pane right by 2 cells
bind -n M-L resize-pane -R 2

# ====
# KEY BINDINGS — PANE NAVIGATION (Alt + lowercase vim keys, no prefix needed)
# ====

# Navigate to pane on the left
bind -n M-h select-pane -L

# Navigate to pane on the right
bind -n M-i select-pane -R

# Navigate to pane below
bind -n M-d select-pane -D

# Navigate to pane above
bind -n M-u select-pane -U

# Cycle through panes in order
bind -n M-o select-pane -t :.+

# Navigate to pane on the left (Alt+j)
bind -n M-j select-pane -L

# Cycle to the previous pane (Alt+k)
bind -n M-k select-pane -t :.-

# Navigate to pane on the right (Alt+l)
bind -n M-l select-pane -R

# ====
# KEY BINDINGS — WINDOW MANAGEMENT
# ====

# Create a new window (prefix + c) — keeps current working directory
bind c new-window -c "#{pane_current_path}"

# Rename current window (prefix + ,) — prompts for new name
bind , command-prompt -I "#W" "rename-window -- '%%'"

# Interactive window picker (prefix + w) — browse with arrows, Enter to select
bind w choose-window

# Find window by name (prefix + f) — type to search, matches in real time
bind f command-prompt "find-window -- '%%'"

# Close/kill the current pane (prefix + d) — skips confirmation prompt
bind d kill-pane

# Close/kill the current window (prefix + X) — skips confirmation prompt
bind X kill-window

# Switch to the next window (prefix + n)
bind n next-window

# Switch to the previous window (prefix + p)
bind p previous-window

# Toggle between current and last window (prefix + Tab)
bind k last-window

# Swap current window left (prefix + <)
bind -r "<" swap-window -d -t -1

# Swap current window right (prefix + >)
bind -r ">" swap-window -d -t +1

# Switch to the next window (Alt+n) and previous window (Alt+p), no prefix needed
bind -n M-n next-window
bind -n M-p previous-window

# Jump directly to window by number with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ====
# KEY BINDINGS — SELECT OR CREATE WINDOW BY NUMBER (prefix + a + <number>)
# ====
# If the window at that number exists, select it; otherwise create it.

bind a switch-client -T window-select-or-create
bind -T window-select-or-create 1 if-shell "tmux select-window -t :1 2>/dev/null" "" "new-window -t :1"
bind -T window-select-or-create 2 if-shell "tmux select-window -t :2 2>/dev/null" "" "new-window -t :2"
bind -T window-select-or-create 3 if-shell "tmux select-window -t :3 2>/dev/null" "" "new-window -t :3"
bind -T window-select-or-create 4 if-shell "tmux select-window -t :4 2>/dev/null" "" "new-window -t :4"
bind -T window-select-or-create 5 if-shell "tmux select-window -t :5 2>/dev/null" "" "new-window -t :5"
bind -T window-select-or-create 6 if-shell "tmux select-window -t :6 2>/dev/null" "" "new-window -t :6"
bind -T window-select-or-create 7 if-shell "tmux select-window -t :7 2>/dev/null" "" "new-window -t :7"
bind -T window-select-or-create 8 if-shell "tmux select-window -t :8 2>/dev/null" "" "new-window -t :8"
bind -T window-select-or-create 9 if-shell "tmux select-window -t :9 2>/dev/null" "" "new-window -t :9"

# ====
# KEY BINDINGS — SESSION MANAGEMENT
# ====

# Detach from session (prefix + D) — session keeps running in background
bind D detach-client

# Switch to previous session (prefix + ()
bind ( switch-client -p

# Switch to next session (prefix + ))
bind ) switch-client -n

# Interactive session picker (prefix + s) — browse with arrows, Enter to select.
# Use the full pane so the overview has maximum vertical space. tmux's native
# choose-tree is line-based and does not support a fixed 4-column grid.
bind s choose-tree -s -Z

# Toggle between current and last session (prefix + L)
bind L switch-client -l

# Rename current session (prefix + $)
bind $ command-prompt -I "#S" "rename-session -- '%%'"

# ====
# KEY BINDINGS — LAYOUT & ZOOM
# ====

# Toggle zoom (fullscreen) on the current pane (prefix + z)
bind z resize-pane -Z

# Cycle through pane layouts (prefix + Space)
bind Space next-layout

# ====
# KEY BINDINGS — CONFIG RELOAD
# ====

# Reload tmux config and show confirmation message (prefix + r)
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ====
# KEY BINDINGS — COPY MODE (Vi-style)
# ====

# Set copy mode to use Vi keybindings
setw -g mode-keys vi

# Paste from tmux buffer (prefix + P)
bind P paste-buffer

# In copy mode: v starts visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# In copy mode: Ctrl+C copies selection to system clipboard
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || xsel -b -i 2>/dev/null || pbcopy'

# In copy mode: V toggles rectangle (block) selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle

# In copy mode: y yanks selection and pipes to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || xsel -b -i 2>/dev/null || pbcopy'

# In copy mode: Enter also yanks to clipboard
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || xsel -b -i 2>/dev/null || pbcopy'

# In copy mode: mouse drag end also copies to clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || xsel -b -i 2>/dev/null || pbcopy'

# ====
# PLUGINS (TPM — Tmux Plugin Manager)
# ====

# List of TPM plugins (install with: Prefix + I after adding a new plugin)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'             # Auto-restore on startup
set -g @continuum-save-interval '15'       # Save interval in minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-nano 'session'
# Restore custom processes (e.g., node, python, tail)
set -g @resurrect-processes 'ssh psql mysql ~python ~node "git log"'

# ====
# CLIPBOARD SETTINGS
# ====

# Enable tmux's built-in clipboard integration (fallback for terminal emulators that support it)
set-option -s set-clipboard on

# ====
# APPEARANCE — PANE BORDERS
# ====

# Inactive pane border style (subtle gray)
set -g pane-border-style 'fg=color233 bg=color234'

# Active pane border style (green highlight)
set -g pane-active-border-style 'bg=color234 fg=color46'

# ====
# APPEARANCE — STATUS BAR
# ====

# Show status bar at the bottom
set -g status-position bottom

# Left side: empty (no session name)
set -g status-left ""

# Right side: pane title only (no time/date)
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\""

# Status bar styling (dark background, dim white text)
set -g status-style 'bg=color233 fg=color15 dim'

# ====
# TPM INIT (keep this as the LAST line)
# ====
run '~/.tmux/plugins/tpm/tpm'
