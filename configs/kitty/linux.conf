# =============================================================================
# KITTY CONFIG (Linux) — installed to ~/.config/kitty/kitty.conf
# =============================================================================
#
# RELOAD / EDIT THIS FILE
#   ctrl+shift+f5       Reload kitty.conf (applies changes without restarting)
#   ctrl+shift+f2       Open kitty.conf in your editor (kitty default)
#   After editing in the repo: make configs, then reload as above.
#
# TMUX INTEGRATION
#   Alt is already sent to apps as Meta on Linux, so tmux bindings like
#   Alt+l / Alt+j / Alt+1..9 work without any remapping. Prefix is Ctrl+a.
#
# COMMON KITTY DEFAULTS (Linux)
#   ctrl+shift+t        New tab
#   ctrl+shift+w        Close tab
#   ctrl+shift+n        New OS window
#   ctrl+shift+enter    New split (window inside the tab)
#   ctrl+shift+[ / ]    Previous / next split
#   ctrl+shift+c / v    Copy / paste
#   ctrl+shift+f        Search scrollback
#   ctrl+shift+l        Clear screen and scrollback
#   ctrl+shift+= / -    Increase / decrease font size
#   ctrl+shift+backspace Reset font size
#
# Full default list: https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts
# =============================================================================

# Font size in points
font_size 14.0
