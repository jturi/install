# =============================================================================
# KITTY CONFIG (macOS) — installed to ~/.config/kitty/kitty.conf
# =============================================================================
#
# RELOAD / EDIT THIS FILE
#   ctrl+cmd+,           Reload kitty.conf (applies changes without restarting)
#   cmd+,                Open kitty.conf in your editor (kitty default)
#   Or quit and reopen kitty.
#   After editing in the repo: make configs, then reload as above.
#
# TMUX INTEGRATION
#   Option (Alt) is sent to apps as Meta (macos_option_as_alt yes), so tmux
#   bindings like Alt+l / Alt+j / Alt+1..9 work. Prefix is Ctrl+a.
#   Cmd+l / Cmd+j / Cmd+1..9 send the same Alt sequences, so they work too.
#
# CUSTOM MAPPINGS (below)
#   cmd+l, cmd+j         -> Alt+l / Alt+j   (tmux next / previous window)
#   cmd+1 .. cmd+9       -> Alt+1 .. Alt+9  (tmux jump to window N)
#                           Overrides kitty's default "go to tab N".
#
# COMMON KITTY DEFAULTS (macOS)
#   cmd+t / cmd+w        New tab / close tab
#   cmd+n                New OS window
#   cmd+enter            New split (window inside the tab)
#   cmd+d                Split right (when using the splits layout)
#   cmd+shift+d          Split down
#   cmd+[ / cmd+]        Previous / next split
#   cmd+shift+enter      Zoom current split (toggle fullscreen pane)
#   cmd+k                Clear screen and scrollback
#   cmd+f                Search scrollback
#   cmd+c / cmd+v        Copy / paste
#   cmd+= / cmd+-        Increase / decrease font size
#   cmd+0                Reset font size
#   cmd+shift+f2         Open kitty.conf (kitty default)
#   ctrl+cmd+,           Reload kitty.conf
#
# Full default list: https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts
# =============================================================================

# Font size in points
font_size 14.0

# Send Option as Alt/Meta so tmux's M-<key> bindings receive it
macos_option_as_alt yes

# Mirror the Ghostty Cmd mappings
map cmd+l send_text all \x1bl
map cmd+j send_text all \x1bj
map cmd+1 send_text all \x1b1
map cmd+2 send_text all \x1b2
map cmd+3 send_text all \x1b3
map cmd+4 send_text all \x1b4
map cmd+5 send_text all \x1b5
map cmd+6 send_text all \x1b6
map cmd+7 send_text all \x1b7
map cmd+8 send_text all \x1b8
map cmd+9 send_text all \x1b9
